---
name: Multi-Distribution Execution Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            install: dnf install -y --refresh python3 python3-pip git bash findutils grep sudo clamav unzip fontconfig
            scripts:
              - "./updates/update-fedora.sh"
              - "./updates/update-fedora-maintenance.sh"
              - "./updates/debloat-fedora-kde.sh"
              - "./updates/system-cleanup.sh"
              - "./security/clamav-nightly-scan.sh"
              - "./security/run-clamav-scan.sh"
              - "./security/update-clamav-signatures.sh"
              - "./security/osi-security-overview.sh"
              - "./configs/setup-scripts/setup-bashrc.sh"
              - "./configs/setup-scripts/setup-alacritty.sh"
              - "./utils/system-health-report.sh"

          - name: RedHat (Rocky Linux)
            image: rockylinux/rockylinux:10
            install: dnf install -y epel-release && dnf install -y --refresh python3 python3-pip git bash findutils grep sudo clamav
            scripts:
              - "./updates/update-fedora.sh"
              - "./updates/update-fedora-maintenance.sh"
              - "./updates/debloat-fedora-kde.sh"
              - "./updates/system-cleanup.sh"
              - "./security/clamav-nightly-scan.sh"
              - "./security/run-clamav-scan.sh"
              - "./security/update-clamav-signatures.sh"
              - "./security/osi-security-overview.sh"
              - "./configs/setup-scripts/setup-bashrc.sh"
              - "./utils/system-health-report.sh"

          - name: Ubuntu
            image: ubuntu:26.04
            install: DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip git bash findutils grep sudo clamav
            scripts:
              - "./updates/update-ubuntu.sh"
              - "./updates/update-mint.sh"
              - "./updates/clean-mint.sh"
              - "./updates/system-cleanup.sh"
              - "./security/clamav-nightly-scan.sh"
              - "./security/run-clamav-scan.sh"
              - "./security/update-clamav-signatures.sh"
              - "./security/osi-security-overview.sh"
              - "./configs/setup-scripts/setup-bashrc.sh"
              - "./utils/system-health-report.sh"

          - name: Debian
            image: debian:latest
            install: DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip git bash findutils grep sudo clamav
            scripts:
              - "./updates/update-ubuntu.sh"
              - "./updates/system-cleanup.sh"
              - "./security/clamav-nightly-scan.sh"
              - "./security/run-clamav-scan.sh"
              - "./security/update-clamav-signatures.sh"
              - "./security/osi-security-overview.sh"
              - "./configs/setup-scripts/setup-bashrc.sh"
              - "./utils/system-health-report.sh"

          - name: Arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm python git bash findutils grep sudo clamav
            scripts:
              - "./updates/update-arch.sh"
              - "./updates/system-cleanup.sh"
              - "./security/clamav-nightly-scan.sh"
              - "./security/run-clamav-scan.sh"
              - "./security/update-clamav-signatures.sh"
              - "./security/osi-security-overview.sh"
              - "./configs/setup-scripts/setup-bashrc.sh"
              - "./utils/system-health-report.sh"

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Runtime Dependencies
        run: ${{ matrix.install }}

      - name: Execute Shell Scripts
        shell: bash
        env:
          USER: root
          CI: true
          # These scan through the ClamAV daemon (clamd), which containers don't run and
          # which needs a virus database that can't be downloaded reliably in CI. A scan here
          # always ends with "Total errors" and exit code 2, so they are only syntax-checked.
          NEEDS_CLAMD: >-
            ./security/clamav-nightly-scan.sh
            ./security/run-clamav-scan.sh
        run: |
          failed=0

          for script in ${{ join(matrix.scripts, ' ') }}; do
            echo "::group::$script"
            if [[ ! -f "$script" ]]; then
              # A wrong path in this workflow used to skip the script silently
              echo "::error title=Missing script::$script is listed in the workflow but does not exist"
              failed=1
            elif ! bash -n "$script"; then
              echo "::error file=${script#./},title=Syntax error::bash -n failed for $script"
              failed=1
            elif [[ " $NEEDS_CLAMD " == *" $script "* ]]; then
              echo "::notice file=${script#./},title=Syntax only::$script needs a running clamd and virus database; syntax-checked only"
            else
              echo "Running: $script"
              chmod +x "$script"
              if ! bash "$script"; then
                echo "::error file=${script#./},title=Execution failed::$script exited with an error on ${{ matrix.name }}"
                failed=1
              fi
            fi
            echo "::endgroup::"
          done

          exit $failed

      - name: Smoke Test All Python Scripts (.py)
        shell: bash
        env:
          USER: root
          CI: true
        run: |
          echo "::group::Scanning Python scripts"
          failed=0
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            if ! python3 -m py_compile "$script"; then
              echo "❌ Compilation error found in $script"
              failed=1
            fi
          done < <(find . -type d \( -name node_modules -o -name .git -o -name .venv \) -prune -o -type f -name "*.py" -print0)
          echo "::endgroup::"
          exit $failed
