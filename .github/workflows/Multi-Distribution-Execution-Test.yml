---
name: Multi-Distribution Execution Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            pm: dnf
            install: dnf install -y --refresh python3 python3-pip git bash findutils grep sudo clamav
          - name: RedHat (Rocky 9)
            image: rockylinux:9
            pm: dnf
            install: dnf install -y epel-release && dnf install -y --refresh python3 python3-pip git bash findutils grep sudo clamav
          - name: Ubuntu
            image: ubuntu:latest
            pm: apt
            install: DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip git bash findutils grep sudo clamav
          - name: Debian
            image: debian:latest
            pm: apt
            install: DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip git bash findutils grep sudo clamav
          - name: Arch
            image: archlinux:latest
            pm: pacman
            install: pacman -Syu --noconfirm python git bash findutils grep sudo clamav

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Runtime Dependencies
        run: ${{ matrix.install }}

      - name: Execute Shell Scripts
        shell: bash
        env:
          USER: root
          CI: true
        run: |
          echo "::group::Executing testable scripts on ${{ matrix.name }}"
          failed=0
          
          # Explicit array of testable scripts across updates, security, and utils
          testable_scripts=(
            "./updates/update-fedora.sh"
            "./updates/update-fedora-maintenance.sh"
            "./updates/debloat-fedora-kde.sh"
            "./updates/update-ubuntu.sh"
            "./updates/update-arch.sh"
            "./updates/update-mint.sh"
            "./updates/clean-mint.sh"
            "./updates/system-cleanup.sh"
            "./security/clamav-nightly-scan.sh"
            "./security/run-clamav-scan.sh"
            "./security/update-clamav-signatures.sh"
            "./utils/system-health-report.sh"
            "./utils/osi-security-overview.sh"
          )

          for script in "${testable_scripts[@]}"; do
            if [[ -f "$script" ]]; then
              echo "Running: $script"
              chmod +x "$script"
              if ! bash -n "$script"; then
                echo "❌ Syntax error in $script"
                failed=1
              elif ! bash "$script"; then
                echo "❌ Execution failed in $script"
                failed=1
              fi
            fi
          done
          
          echo "::endgroup::"
          exit $failed

      - name: Smoke Test All Python Scripts (.py)
        shell: bash
        env:
          USER: root
          CI: true
        run: |
          echo "::group::Scanning Python scripts"
          failed=0
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            if ! python3 -m py_compile "$script"; then
              echo "❌ Compilation error found in $script"
              failed=1
            fi
          done < <(find . -type d \( -name node_modules -o -name .git -o -name .venv \) -prune -o -type f -name "*.py" -print0)
          echo "::endgroup::"
          exit $failed
