name: Auto Update README Tables
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update-readme-tables:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          
      - name: Generate Formatted Tables & Update README
        run: |
          python3 -c '
          import os, re
          
          FOLDER_DESCS = {
              "configs": "Terminal & CLI tool dotfiles",
              "configs/setup-scripts": "Dotfile Deployment Scripts",
              "desktop-tweaks": "UI customization & desktop scripts",
              "provisioning": "Workstation Bootstrap & Setup",
              "repo-management": "LLM Metadata & Repo Organization",
              "security": "Antivirus & system defense utilities",
              "updates": "Distro maintenance & update scripts",
              "utils": "General standalone helper scripts"
          }
          
          IGNORE_FILES = {"README.md", "readme.md", "tree_output.txt"}
          
          def get_file_description(filepath):
              if not os.path.isfile(filepath):
                  return ""
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      for _ in range(15):
                          line = f.readline().strip()
                          if line.startswith("# Description:"):
                              return line.replace("# Description:", "").strip()
                          # Catch python/bash comments that might just be descriptions
                          elif line.startswith("#") and not line.startswith("#!"):
                              return line.lstrip("#").strip()
              except Exception:
                  pass
              return ""
              
          table_output = []
          directories = []
          
          # Recursively walk through all directories
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              
              valid_files = [f for f in files if f not in IGNORE_FILES]
              if valid_files:
                  directories.append(root)
                  
          directories = sorted(directories)
          
          for d_path in directories:
              if d_path == ".":
                  continue
                  
              folder_name = d_path.lstrip("./")
              folder_desc = FOLDER_DESCS.get(folder_name, "")
              header_desc = f" ({folder_desc})" if folder_desc else ""
              
              table_output.append(f"### 📁 {folder_name}{header_desc}\n")
              table_output.append("| File | Description |")
              table_output.append("|---|---|")
              
              # Include all files, not just .md
              files = sorted([f for f in os.listdir(d_path) if os.path.isfile(os.path.join(d_path, f)) and f not in IGNORE_FILES])
              
              for f in files:
                  file_path = os.path.join(d_path, f)
                  desc = get_file_description(file_path)
                  table_output.append(f"| <a href=\"{folder_name}/{f}\"><code>{f}</code></a> | {desc} |")
              
              table_output.append("\n")
              
          final_str = "\n".join(table_output).strip()
          
          with open("README.md", "r") as f:
              readme = f.read()
              
          pattern = r"(<!-- START_SECTION:tree -->)(.*?)(<!-- END_SECTION:tree -->)"
          updated = re.sub(pattern, lambda m: m.group(1) + "\n" + final_str + "\n" + m.group(3), readme, flags=re.DOTALL)
          
          with open("README.md", "w") as f:
              f.write(updated)
          '
          
      - name: Sync with remote branch
        run: git pull --rebase --autostash origin main || true
          
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "ci: fix auto-tables script for bash and python files"
