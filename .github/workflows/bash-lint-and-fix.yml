name: Maintain and Auto-Fix Bash Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auto-fix-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt shellcheck patch dos2unix

      - name: Pull latest changes before modifying files
        run: |
          git config pull.rebase true
          git pull origin ${{ github.head_ref || github.ref_name }}

      - name: Sanitize hidden web formatting
        run: |
          find . -type f -name "*.sh" -exec sed -i 's/\xc2\xa0/ /g' {} +

      - name: Auto-format Bash scripts (shfmt)
        run: |
          find . -type f -name "*.sh" -exec shfmt -w -i 2 -ci {} +

      - name: Auto-fix Shebang placement (SC1128)
        run: |
          find . -type f -name "*.sh" -exec dos2unix -q {} +
          find . -type f -name "*.sh" -exec bash -c 'for f; do if grep -q "^#!" "$f"; then sed -i -n "/^#!/,\$p" "$f"; fi; done' _ {} +

      - name: Auto-apply ShellCheck fixes (SC2129, SC2181, SC2162)
        run: |
          find . -type f -name "*.sh" -exec shellcheck -f diff {} + > shellcheck-fixes.patch || true
          if [ -s shellcheck-fixes.patch ]; then
            patch -p1 < shellcheck-fixes.patch
          fi
          rm -f shellcheck-fixes.patch

      - name: Commit auto-remediations
        id: auto-commit
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: fully automated shfmt and shellcheck fixes"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "77777kaz77777 <153332224+77777kaz77777@users.noreply.github.com>"
          skip_fetch: true
          skip_push: true

      - name: Push changes (rebase and retry if the branch moved)
        if: steps.auto-commit.outputs.changes_detected == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another workflow may have pushed to the same branch while this job ran.
          # Rebase onto it (their side wins on overlapping lines) and retry.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run ShellCheck (Strict Errors Only)
        run: |
          find . -type f -name "*.sh" -exec shellcheck --severity=error {} +
