name: Deploy Zensical
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install zensical
      
      - name: Auto-generate Code Reference Page
        run: |
          python3 -c '
          import os
          
          extensions = (".sh", ".py", ".json", ".toml", ".jsonc", ".conf", ".txt", ".service", ".timer")
          exclude_dirs = {".git", ".github"}
          
          output = ["# Source Code Reference\n\nAutomatically generated list of all scripts, configs, and systemd units in this repository.\n"]
          
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in exclude_dirs]
              for file in sorted(files):
                  if file.endswith(extensions):
                      filepath = os.path.join(root, file).lstrip("./")
                      ext = filepath.split(".")[-1]
                      
                      # Map extensions to proper markdown syntax highlighting languages
                      lang_map = {
                          "sh": "bash",
                          "py": "python",
                          "json": "json",
                          "jsonc": "json",
                          "toml": "toml",
                          "conf": "ini",
                          "txt": "text",
                          "service": "ini",
                          "timer": "ini"
                      }
                      lang = lang_map.get(ext, "text")
                      
                      output.append(f"## {filepath}\n")
                      output.append(f"```{lang} title=\"{filepath}\"")
                      output.append(f"--8<-- \"{filepath}\"")
                      output.append("```\n")
          
          with open("code-reference.md", "w") as f:
              f.write("\n".join(output))
          '
          
      - run: zensical build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - uses: actions/deploy-pages@v4
