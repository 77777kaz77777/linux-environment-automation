name: Container Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-all-scripts:
    name: Smoke Test All Scripts in Fedora Container
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Runtime Dependencies
        run: |
          dnf install -y --refresh python3 python3-pip git bash findutils

      - name: Smoke Test All Shell Scripts (.sh)
        run: |
          echo "Scanning and testing syntax for all shell scripts..."
          failed=0
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            if ! bash -n "$script"; then
              echo "❌ Syntax error found in $script"
              failed=1
            fi
          done < <(find . -name "*.sh" -not -path "./node_modules/*" -print0)
          exit $failed

      - name: Smoke Test All Python Scripts (.py)
        run: |
          echo "Scanning and compiling all Python scripts..."
          failed=0
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            if ! python3 -m py_compile "$script"; then
              echo "❌ Compilation error found in $script"
              failed=1
            fi
          done < <(find . -name "*.py" -not -path "./node_modules/*" -print0)
          exit $failed
