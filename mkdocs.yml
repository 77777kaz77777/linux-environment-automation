site_name: Linux Environment Automation
site_description: Automated configuration, provisioning, and dotfiles for Linux environments.
site_url: https://77777kaz77777.github.io/linux-environment-automation/
repo_url: https://github.com/77777kaz77777/linux-environment-automation
repo_name: GitHub

docs_dir: .

# Raw scripts/configs are shown through their generated <file>.md pages.
# Publishing the raw files too would collide with those page URLs.
# The root README is the GitHub landing page; the site uses the generated index.md.
exclude_docs: |
  /README.md
  mkdocs.yml
  zensical.toml
  .markdownlint.yaml
  .yamllint
  LICENSE
  *.sh
  *.py
  *.toml
  *.conf
  *.service
  *.timer
  *.jsonc
  *.yaml
  *.txt
  .github/
  .gitignore
  .obsidian/

theme:
  name: material
  variant: modern
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: lucide/terminal
    repo: fontawesome/brands/github
  palette:
    # Dark mode (Pure Monochrome Dark)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: white
      toggle:
        icon: lucide/moon
        name: Switch to light mode
    # Light mode (Clean Monochrome Light)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: black
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.action.view
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
